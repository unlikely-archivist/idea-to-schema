name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: idea_to_schema
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps run.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/idea_to_schema
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/idea_to_schema_test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install
        run: |
          npm ci --prefix server
          npm ci --prefix web

      - name: Run migrations
        working-directory: server
        run: npm run db:migrate

      - name: Type-check server
        working-directory: server
        run: npm run typecheck

      - name: Type-check web
        working-directory: web
        run: npm run typecheck

      - name: Run tests
        working-directory: server
        run: npm test
